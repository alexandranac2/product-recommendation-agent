name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # CPU-only torch wheels: nothing here needs a GPU and this keeps the install small
      - run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # Real embedding model + FAISS index; fails the build if retrieval quality regresses
      - run: python -m evals.retrieval_eval --min-hit3 0.9
